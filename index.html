<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let It Glow Audio</title><style>
body{font:17px system-ui;background:#101827;color:#fff;margin:0;padding:24px;text-align:center}main{max-width:540px;margin:4vh auto}button{font:inherit;padding:15px 24px;border:0;border-radius:12px;background:#b7f7d0;color:#102017}audio{width:100%;margin:20px 0}small{color:#b6c3d4}#status{margin:20px 0;white-space:pre-line}.metrics{background:#1d2b40;padding:12px;border-radius:10px;color:#dbeafe;margin:15px 0}a{color:#b7f7d0}label{display:block;margin:12px}
</style></head><body><main><h1>✨ Let It Glow Audio</h1><p>Luister via het lokale wifinetwerk</p><button id="go">▶ Start luisteren</button><div id="status">Wachten op FPP…</div><div class="metrics" id="metrics">Synchronisatie: wachten…</div><label><input type="checkbox" id="diagnostic"> Diagnose: correcties uitschakelen</label><audio id="player" controls preload="auto" playsinline></audio><p><small>v0.4 test · Houd dit scherm actief · Geen Bluetooth · Op iPhone: tik eventueel op ▶ in de speler</small></p><p><a href="https://www.facebook.com/share/19ccTSeDQQ/">DJ Jens op Facebook</a></p></main><script>
const audio=document.getElementById('player'),status=document.getElementById('status'),go=document.getElementById('go'),metrics=document.getElementById('metrics'),diagnostic=document.getElementById('diagnostic');
let enabled=false,last='',busy=false,clockOffset=0,haveClock=false,target=null,rtt=0,history=[],lastSeek=0,playRejected=false;
function syncClock(s,t0,t1){const sample=s.serverTime-(t0+t1)/2;if(!haveClock){clockOffset=sample;haveClock=true;}else if(Math.abs(sample-clockOffset)<0.5)clockOffset=clockOffset*.92+sample*.08;}
function expected(){return target?target.elapsed+Math.max(0,Date.now()/1000+clockOffset-target.sampleTime):null;}
function correct(){if(!target||!enabled||audio.readyState<1||audio.paused)return;const t=expected();if(t===null)return;const desired=Math.max(0,Math.min(t,Number.isFinite(audio.duration)?Math.max(0,audio.duration-.05):t));const error=desired-audio.currentTime;
history.push(error);if(history.length>15)history.shift();const sorted=[...history].sort((a,b)=>a-b),median=sorted[Math.floor(sorted.length/2)];
metrics.textContent='Geschatte browserafwijking: '+Math.round(error*1000)+' ms · mediaan '+Math.round(median*1000)+' ms · netwerk '+Math.round(rtt)+' ms · '+(diagnostic.checked?'diagnose (geen correcties)':'stabiele modus');
// Do not adjust playbackRate: rapid corrections caused audible glitches in v0.3.
if(diagnostic.checked||history.length<12||Date.now()-lastSeek<12000)return;
// Only repair a persistent, substantial drift. Never chase small network jitter.
if(Math.abs(median)>1.5&&history.filter(x=>Math.sign(x)===Math.sign(median)&&Math.abs(x)>1.2).length>=12){try{audio.currentTime=desired;lastSeek=Date.now();history=[];}catch(e){}}
}
async function poll(){if(busy)return;busy=true;const t0=Date.now()/1000;try{const r=await fetch('/api/status',{cache:'no-store'});const s=await r.json();const t1=Date.now()/1000;rtt=(t1-t0)*1000;if(!s.ok){status.textContent=s.error;return;}syncClock(s,t0,t1);
if(!s.media){status.textContent='Geen gekoppeld audiobestand gevonden.\nSpeel een sequence af.';target=null;last='';history=[];audio.pause();metrics.textContent='Wachten op FPP…';return;}
status.textContent='🎵 '+s.title+' · '+Math.floor(s.elapsed)+' sec';target={elapsed:Number(s.elapsed),sampleTime:Number(s.sampleTime||s.serverTime)};
if(last!==s.media){last=s.media;history=[];audio.pause();audio.src='/media/'+encodeURIComponent(s.media);audio.load();playRejected=false;}
// Source is prepared even before the user taps Start, so iOS can start it in a gesture.
if(!enabled)return;
if(audio.paused&& !playRejected){playRejected=true;status.textContent+=' · Tik op ▶ in de speler als geluid niet start';}
}catch(e){status.textContent='Verbindingsfout: '+e.message}finally{busy=false;}}
go.onclick=async()=>{enabled=true;go.textContent='✓ Luisteren ingeschakeld';if(!audio.src||!last){status.textContent='Start eerst een sequence in FPP en tik opnieuw.';await poll();return;}try{if(audio.readyState<1)audio.load();await audio.play();playRejected=false;const pos=expected();if(pos!==null&&Number.isFinite(pos)&&Math.abs(pos-audio.currentTime)>1.5){audio.currentTime=Math.max(0,Math.min(pos,Number.isFinite(audio.duration)?audio.duration-.1:pos));lastSeek=Date.now();}go.textContent='✓ Luisteren ingeschakeld';}catch(e){status.textContent='Tik op ▶ in de speler om audio toe te staan op deze telefoon.';}};
audio.addEventListener('play',()=>{playRejected=false;history=[];});
setInterval(poll,500);setInterval(correct,250);poll();
</script></body></html>
