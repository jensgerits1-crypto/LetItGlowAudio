<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let It Glow Audio</title>
<style>
body{font:17px system-ui,-apple-system,sans-serif;background:#101827;color:#fff;margin:0;padding:24px;text-align:center}main{max-width:560px;margin:3vh auto}button{font:inherit;padding:15px 24px;border:0;border-radius:12px;background:#b7f7d0;color:#102017;cursor:pointer}audio{width:100%;margin:18px 0}small{color:#b6c3d4}#status{margin:20px 0;white-space:pre-line}.metrics{background:#1d2b40;padding:12px;border-radius:10px;color:#dbeafe;margin:15px 0}a{color:#b7f7d0}label{display:block;margin:12px}#hint{color:#ffdb8a;min-height:2em}#go{max-width:100%}
</style></head><body><main><h1>✨ Let It Glow Audio</h1><p>Luister via het lokale wifinetwerk</p>
<button id="go">▶ Start luisteren</button><div id="status">Wachten op FPP…</div><div class="metrics" id="metrics">Synchronisatie: wachten…</div>
<label><input type="checkbox" id="diagnostic"> Diagnose: synchronisatiecorrecties uitschakelen</label><audio id="player" controls preload="auto" playsinline></audio><div id="hint" role="status"></div>
<p><small>v0.5 test · Houd dit scherm actief · Gebruik de luidspreker van je gsm (geen Bluetooth) · Tik eenmaal op Start luisteren</small></p><p><a href="https://www.facebook.com/share/19ccTSeDQQ/">DJ Jens op Facebook</a></p></main>
<script>
'use strict';
const audio=document.getElementById('player'),status=document.getElementById('status'),go=document.getElementById('go'),metrics=document.getElementById('metrics'),diagnostic=document.getElementById('diagnostic'),hint=document.getElementById('hint');
let enabled=false,media='',busy=false,clockOffset=0,haveClock=false,target=null,rtt=0,history=[],lastSeek=0;
let trackGeneration=0,playPending=false,manualPause=false,autoplayBlocked=false,lastCorrectionAt=0;
const now=()=>Date.now()/1000;
function syncClock(s,t0,t1){if(!Number.isFinite(Number(s.serverTime)))return;const sample=Number(s.serverTime)-(t0+t1)/2;if(!haveClock){clockOffset=sample;haveClock=true;}else if(Math.abs(sample-clockOffset)<0.5)clockOffset=clockOffset*.92+sample*.08;}
function expected(){if(!target)return null;return target.elapsed+Math.max(0,now()+clockOffset-target.sampleTime);}
function clampPos(t){return Math.max(0,Math.min(t,Number.isFinite(audio.duration)?Math.max(0,audio.duration-.08):t));}
function alignOnStart(){const t=expected();if(t===null||!Number.isFinite(t)||audio.readyState<1)return;try{audio.currentTime=clampPos(t);lastSeek=Date.now();history=[];}catch(e){}}
async function requestPlayback(generation){if(!enabled||manualPause||playPending||generation!==trackGeneration||!media)return;
 playPending=true;try{await audio.play();if(generation!==trackGeneration)return;autoplayBlocked=false;hint.textContent='';go.textContent='✓ Luisteren ingeschakeld';}
 catch(e){if(generation===trackGeneration){autoplayBlocked=true;hint.textContent='Automatisch starten werd door je browser geweigerd. Tik op ▶ in de speler of opnieuw op Start luisteren.';go.textContent='▶ Tik om muziek te starten';}}
 finally{playPending=false;}}
function correct(){if(!target||!enabled||audio.readyState<1||audio.paused)return;const t=expected();if(t===null||!Number.isFinite(t))return;
 const error=clampPos(t)-audio.currentTime;history.push(error);if(history.length>24)history.shift();const sorted=[...history].sort((a,b)=>a-b),median=sorted[Math.floor(sorted.length/2)];
 metrics.textContent='Geschatte browserafwijking: '+Math.round(error*1000)+' ms · mediaan '+Math.round(median*1000)+' ms · netwerk '+Math.round(rtt)+' ms · '+(diagnostic.checked?'diagnose (geen correcties)':'stabiele modus');
 // FPP elapsed may be rounded to whole seconds. Never chase sub-second changes.
 if(diagnostic.checked||history.length<20||Date.now()-lastSeek<15000)return;
 // Only correct a persistent, large drift. No playbackRate changes, no repeated seeks.
 const same=history.filter(x=>Math.sign(x)===Math.sign(median)&&Math.abs(x)>1.5).length;
 if(Math.abs(median)>2&&same>=20){try{audio.currentTime=clampPos(t);lastSeek=Date.now();history=[];lastCorrectionAt=Date.now();}catch(e){}}
}
async function poll(){if(busy)return;busy=true;const t0=now();try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();const t1=now();rtt=(t1-t0)*1000;
 if(!s.ok){status.textContent=s.error||'FPP-status niet beschikbaar';return;}syncClock(s,t0,t1);
 if(!s.media){if(media){media='';trackGeneration++;audio.pause();audio.removeAttribute('src');audio.load();}target=null;history=[];status.textContent='Geen gekoppeld audiobestand gevonden.\nSpeel een sequence af.';metrics.textContent='Wachten op FPP…';return;}
 const nextMedia=String(s.media);const elapsed=Number(s.elapsed),sampleTime=Number(s.sampleTime||s.serverTime);
 status.textContent='🎵 '+(s.title||nextMedia)+' · '+Math.floor(elapsed)+' sec';
 if(Number.isFinite(elapsed)&&Number.isFinite(sampleTime))target={elapsed,sampleTime};
 if(media!==nextMedia){media=nextMedia;trackGeneration++;history=[];autoplayBlocked=false;manualPause=false;
  // Keep the same <audio> element: on iOS this gives the best chance to preserve a user-granted play permission.
  audio.src='/media/'+encodeURIComponent(media);audio.load();const generation=trackGeneration;
  if(enabled){requestPlayback(generation);}else{hint.textContent='Tik op Start luisteren om audio toe te staan.';}
 }
 }catch(e){status.textContent='Verbindingsfout: '+e.message;}finally{busy=false;}}
// The first play() must happen inside a direct user gesture on Safari/iOS.
go.addEventListener('click',()=>{enabled=true;manualPause=false;go.textContent='✓ Luisteren ingeschakeld';hint.textContent='';
 if(!media){hint.textContent='Start eerst een sequence in FPP.';poll();return;}
 const generation=trackGeneration;alignOnStart();requestPlayback(generation);
});
audio.addEventListener('loadedmetadata',()=>{if(enabled&&media)alignOnStart();});
audio.addEventListener('playing',()=>{autoplayBlocked=false;manualPause=false;hint.textContent='';});
audio.addEventListener('pause',()=>{if(enabled&&media&&!audio.ended&&audio.readyState>=2&&!playPending){/* Pause may be browser-initiated; do not force resume to respect user */}});
audio.addEventListener('error',()=>{hint.textContent='Audio kon niet geladen worden. Controleer of het MP3-bestand op FPP bestaat.';});
setInterval(poll,500);setInterval(correct,250);poll();
</script></body></html>
