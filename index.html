<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let It Glow Audio</title><style>
body{font:17px system-ui;background:#101827;color:#fff;margin:0;padding:24px;text-align:center}main{max-width:540px;margin:4vh auto}button{font:inherit;padding:15px 24px;border:0;border-radius:12px;background:#b7f7d0;color:#102017}audio{width:100%;margin:20px 0}small{color:#b6c3d4}#status{margin:20px 0;white-space:pre-line}.metrics{background:#1d2b40;padding:12px;border-radius:10px;color:#dbeafe;margin:15px 0}a{color:#b7f7d0}
</style></head><body><main><h1>✨ Let It Glow Audio</h1><p>Luister via het lokale wifinetwerk</p><button id="go">▶ Start luisteren</button><div id="status">Wachten op FPP…</div><div class="metrics" id="metrics">Synchronisatie: wachten…</div><audio id="player" controls preload="auto" playsinline></audio><p><small>v0.3 · Houd dit scherm actief · Gebruik de luidspreker van je gsm (geen Bluetooth)</small></p><p><a href="https://www.facebook.com/share/19ccTSeDQQ/">DJ Jens op Facebook</a></p></main><script>
const audio=document.getElementById('player'),status=document.getElementById('status'),go=document.getElementById('go'),metrics=document.getElementById('metrics');
let enabled=false,last='',busy=false,clockOffset=0,haveClock=false,target=null,lastSample=0,serverStatus='',rtt=0,playAttempt=0;
// clockOffset = server epoch seconds - client epoch seconds (estimated from RTT midpoint)
function syncClock(s,t0,t1){const sample=s.serverTime-(t0+t1)/2; if(!haveClock||sample<clockOffset-2||sample>clockOffset+2){clockOffset=sample;haveClock=true;}else clockOffset=clockOffset*.85+sample*.15;}
function expected(){if(!target)return null;return target.elapsed+Math.max(0,Date.now()/1000+clockOffset-target.sampleTime);}
function correct(){if(!enabled||!target||audio.readyState<1||audio.paused)return;const t=expected();if(t===null)return;const desired=Math.max(0,Math.min(t,Number.isFinite(audio.duration)?Math.max(0,audio.duration-.06):t));const error=desired-audio.currentTime;metrics.textContent='Geschatte browserafwijking: '+Math.round(error*1000)+' ms · netwerk '+Math.round(rtt)+' ms · '+(audio.playbackRate===1?'normale snelheid':'fijnafstemming');
if(Math.abs(error)>.28){try{audio.currentTime=desired;audio.playbackRate=1}catch(e){}}else if(Math.abs(error)>.055){audio.playbackRate=error>0?1.035:.965}else audio.playbackRate=1;}
async function poll(){if(busy)return;busy=true;const t0=Date.now()/1000;try{const r=await fetch('/api/status',{cache:'no-store'});const s=await r.json();const t1=Date.now()/1000;rtt=(t1-t0)*1000;if(!s.ok){status.textContent=s.error;return;}syncClock(s,t0,t1);serverStatus=s.rawStatus||'';
if(!s.media){status.textContent='Geen gekoppeld audiobestand gevonden.\nSpeel een sequence af.';target=null;last='';audio.pause();audio.playbackRate=1;metrics.textContent='Wachten op FPP…';return;}
status.textContent='🎵 '+s.title+' · '+Math.floor(s.elapsed)+' sec';target={elapsed:Number(s.elapsed),sampleTime:Number(s.sampleTime||s.serverTime)};lastSample=Date.now();if(!enabled)return;
if(last!==s.media){last=s.media;audio.pause();audio.src='/media/'+encodeURIComponent(s.media);audio.load();audio.playbackRate=1;await new Promise(resolve=>{if(audio.readyState>=1)return resolve();audio.addEventListener('loadedmetadata',resolve,{once:true});setTimeout(resolve,1200)});const pos=expected();if(pos!==null&&Number.isFinite(pos))try{audio.currentTime=Math.max(0,pos)}catch(e){}await audio.play().catch(()=>{status.textContent+=' · Tik op ▶ in de speler';});}
if(audio.paused&&Date.now()-playAttempt>1200){playAttempt=Date.now();audio.play().catch(()=>{});}correct();
}catch(e){status.textContent='Verbindingsfout: '+e.message}finally{busy=false;}}
go.onclick=()=>{enabled=true;go.textContent='✓ Luisteren ingeschakeld';audio.play().catch(()=>{});poll()};
setInterval(poll,250);setInterval(correct,100);poll();
</script></body></html>
