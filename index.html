<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let It Glow Audio</title><style>body{font:17px system-ui;background:#101827;color:#fff;margin:0;padding:24px;text-align:center}main{max-width:520px;margin:5vh auto}button{font:inherit;padding:15px 24px;border:0;border-radius:12px;background:#b7f7d0;color:#102017}audio{width:100%;margin:20px 0}small{color:#b6c3d4}#status{margin:20px 0}</style><main><h1>✨ Let It Glow Audio</h1><p>Luister via het lokale wifinetwerk</p><button id="go">▶ Start luisteren</button><div id="status">Wachten op verbinding…</div><audio id="player" controls preload="none"></audio><p><small>Testversie · synchronisatie is niet gegarandeerd · houd het scherm actief</small></p></main><script>
const audio=document.getElementById('player'),status=document.getElementById('status'),go=document.getElementById('go');let enabled=false,last='',busy=false;go.onclick=()=>{enabled=true;go.textContent='Luisteren ingeschakeld';audio.play().catch(()=>{});poll()};async function poll(){if(busy)return;busy=true;try{const r=await fetch('/api/status',{cache:'no-store'}),s=await r.json();if(!s.ok){status.textContent=s.error;return}if(!s.media){status.textContent='Geen gekoppeld audiobestand gevonden. Speel een sequence af.';audio.pause();last='';return}status.textContent='🎵 '+s.title+' · '+Math.floor(s.elapsed)+' sec';if(!enabled)return;if(last!==s.media){last=s.media;audio.src='/media/'+encodeURIComponent(s.media);audio.load();await audio.play().catch(()=>{status.textContent+=' · Tik op ▶ in de speler'});}if(audio.readyState>=1&&Number.isFinite(s.elapsed)&&Math.abs(audio.currentTime-s.elapsed)>1.2){audio.currentTime=Math.min(Math.max(0,s.elapsed),Math.max(0,(audio.duration||s.elapsed+1)-0.1))}if(audio.paused&&enabled)audio.play().catch(()=>{});}catch(e){status.textContent='Verbindingsfout: '+e.message}finally{busy=false}}setInterval(poll,1200);poll();
</script></html>
